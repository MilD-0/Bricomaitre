name: bricadmin

x-storefront-api-blue: &storefront-api-blue
  build:
    context: ../..
    dockerfile: ops/docker/Dockerfile.storefront-api
  restart: unless-stopped
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/storefront-api.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
    interval: 10s
    timeout: 5s
    retries: 12

x-admin-blue: &admin-blue
  build:
    context: ../..
    dockerfile: ops/docker/Dockerfile.admin
    target: web
    args:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  restart: unless-stopped
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/admin.env
  environment:
    STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  depends_on:
    storefront-api-blue:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
    interval: 10s
    timeout: 5s
    retries: 12

x-admin-worker-blue: &admin-worker-blue
  build:
    context: ../..
    dockerfile: ops/docker/Dockerfile.admin
    target: worker
    args:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  restart: unless-stopped
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/admin.env
  environment:
    STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  depends_on:
    storefront-api-blue:
      condition: service_healthy

x-admin-migrations-blue: &admin-migrations-blue
  build:
    context: ../..
    dockerfile: ops/docker/Dockerfile.admin
    target: worker
    args:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  restart: "no"
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/admin.env
  environment:
    STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
    ADMIN_DB_TASK: ${ADMIN_DB_TASK:-verify}
  depends_on:
    postgres:
      condition: service_healthy
  command:
    - bash
    - -lc
    - pnpm --filter adminstration db:$${ADMIN_DB_TASK:?ADMIN_DB_TASK is required}

x-storefront-blue: &storefront-blue
  build:
    context: ../..
    dockerfile: ops/docker/Dockerfile.storefront
    network: host
    args:
      STOREFRONT_API_BASE_URL: http://127.0.0.1:3101
  restart: unless-stopped
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/storefront.env
  environment:
    STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  depends_on:
    storefront-api-blue:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
    interval: 10s
    timeout: 5s
    retries: 12

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bricadmin}
      POSTGRES_USER: ${POSTGRES_USER:-bricadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bricadmin} -d ${POSTGRES_DB:-bricadmin}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  storefront-api-blue:
    <<: *storefront-api-blue
    ports:
      - "127.0.0.1:3101:3001"

  storefront-api-green:
    <<: *storefront-api-blue
    ports:
      - "127.0.0.1:3102:3001"

  adminstration-blue:
    <<: *admin-blue

  adminstration-green:
    <<: *admin-blue
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.admin
      target: web
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
        STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    environment:
      STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    depends_on:
      storefront-api-green:
        condition: service_healthy

  admin-worker-blue:
    <<: *admin-worker-blue

  admin-migrations-blue:
    <<: *admin-migrations-blue

  admin-worker-green:
    <<: *admin-worker-blue
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.admin
      target: worker
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
        STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    environment:
      STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    depends_on:
      storefront-api-green:
        condition: service_healthy

  admin-migrations-green:
    <<: *admin-migrations-blue
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.admin
      target: worker
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
        STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    environment:
      STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
      ADMIN_DB_TASK: ${ADMIN_DB_TASK:-verify}

  storefront-blue:
    <<: *storefront-blue

  storefront-green:
    <<: *storefront-blue
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.storefront
      network: host
      args:
        STOREFRONT_API_BASE_URL: http://127.0.0.1:3102
    environment:
      STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    depends_on:
      storefront-api-green:
        condition: service_healthy

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${BRIC_RUNTIME_DIR:-/srv/bric/runtime}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
