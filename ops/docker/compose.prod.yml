name: bricadmin

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bricadmin}
      POSTGRES_USER: ${POSTGRES_USER:-bricadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bricadmin} -d ${POSTGRES_DB:-bricadmin}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  storefront-api:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.storefront-api
    restart: unless-stopped
    env_file:
      - ${BRIC_ENV_DIR:-/srv/bric/env}/storefront-api.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  adminstration:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.admin
      target: web
    restart: unless-stopped
    env_file:
      - ${BRIC_ENV_DIR:-/srv/bric/env}/admin.env
    depends_on:
      storefront-api:
        condition: service_healthy

  admin-worker:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.admin
      target: worker
    restart: unless-stopped
    env_file:
      - ${BRIC_ENV_DIR:-/srv/bric/env}/admin.env
    depends_on:
      storefront-api:
        condition: service_healthy

  storefront:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.storefront
    restart: unless-stopped
    env_file:
      - ${BRIC_ENV_DIR:-/srv/bric/env}/storefront.env
    depends_on:
      storefront-api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    depends_on:
      storefront-api:
        condition: service_started
      adminstration:
        condition: service_started
      storefront:
        condition: service_started
    environment:
      BRIC_ADMIN_DOMAIN: ${BRIC_ADMIN_DOMAIN:-admin.example.com}
      BRIC_API_DOMAIN: ${BRIC_API_DOMAIN:-api.example.com}
      BRIC_STOREFRONT_DOMAIN: ${BRIC_STOREFRONT_DOMAIN:-www.example.com}
      BRIC_STOREFRONT_APEX_DOMAIN: ${BRIC_STOREFRONT_APEX_DOMAIN:-example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/templates:/etc/nginx/templates:ro

volumes:
  postgres-data:
  redis-data:
