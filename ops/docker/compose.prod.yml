name: bricadmin

x-logging: &default-logging
  driver: local
  options:
    max-size: ${BRIC_LOG_MAX_SIZE:-20m}
    max-file: ${BRIC_LOG_MAX_FILES:-5}

x-release-environment: &release-environment
  SENTRY_RELEASE: ${BRIC_RELEASE_COMMIT:-unknown}

x-storefront-api-blue: &storefront-api-blue
  restart: unless-stopped
  init: true
  # Public commerce is the highest-priority application tier. A host-wide OOM
  # must reclaim admin workloads before the storefront API, while the larger
  # hard limit prevents an isolated API cgroup from being killed first.
  oom_score_adj: ${BRIC_STOREFRONT_API_OOM_SCORE_ADJ:--900}
  pids_limit: ${BRIC_STOREFRONT_API_PIDS_LIMIT:-256}
  stop_grace_period: 30s
  logging: *default-logging
  read_only: true
  ulimits:
    core:
      soft: 0
      hard: 0
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: ${BRIC_STOREFRONT_API_MEM_LIMIT:-1536m}
  mem_reservation: ${BRIC_STOREFRONT_API_MEM_RESERVATION:-1024m}
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/storefront-api.env
  environment:
    <<: *release-environment
    NODE_OPTIONS: ${BRIC_STOREFRONT_API_NODE_OPTIONS:---max-old-space-size=640}
    PORT: 3001
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'node -e "fetch(''http://127.0.0.1:3001/api/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
      ]
    interval: 10s
    timeout: 5s
    retries: 12

x-storefront-meta-worker: &storefront-meta-worker
  restart: unless-stopped
  init: true
  oom_score_adj: ${BRIC_STOREFRONT_META_WORKER_OOM_SCORE_ADJ:-300}
  pids_limit: ${BRIC_STOREFRONT_META_WORKER_PIDS_LIMIT:-128}
  stop_grace_period: 30s
  logging: *default-logging
  read_only: true
  ulimits:
    core:
      soft: 0
      hard: 0
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: ${BRIC_STOREFRONT_META_WORKER_MEM_LIMIT:-512m}
  mem_reservation: ${BRIC_STOREFRONT_META_WORKER_MEM_RESERVATION:-256m}
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/storefront-api.env
  environment:
    <<: *release-environment
    NODE_OPTIONS: ${BRIC_STOREFRONT_META_WORKER_NODE_OPTIONS:---max-old-space-size=384}
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'node -e "const fs=require(''node:fs''); if (!fs.existsSync(''/BRIC_WORKER_HEARTBEAT_V1'')) process.exit(0); const age=Date.now()-Number(fs.readFileSync(''/tmp/bric-storefront-meta-worker-heartbeat'',''utf8'').trim()); process.exit(age >= 0 && age <= 45000 ? 0 : 1)"',
      ]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 15s

x-admin-blue: &admin-blue
  restart: unless-stopped
  init: true
  # Admin remains available during normal operation but is deliberately more
  # reclaimable than the customer-facing commerce path under host pressure.
  oom_score_adj: ${BRIC_ADMIN_WEB_OOM_SCORE_ADJ:-500}
  pids_limit: ${BRIC_ADMIN_WEB_PIDS_LIMIT:-256}
  stop_grace_period: 30s
  logging: *default-logging
  read_only: true
  ulimits:
    core:
      soft: 0
      hard: 0
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: ${BRIC_ADMIN_WEB_MEM_LIMIT:-1200m}
  mem_reservation: ${BRIC_ADMIN_WEB_MEM_RESERVATION:-512m}
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/admin.env
  environment:
    <<: *release-environment
    NODE_OPTIONS: ${BRIC_ADMIN_WEB_NODE_OPTIONS:---max-old-space-size=768}
    STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  depends_on:
    storefront-api-blue:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'node -e "fetch(''http://127.0.0.1:3000/api/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
      ]
    interval: 10s
    timeout: 5s
    retries: 12

x-admin-worker-blue: &admin-worker-blue
  restart: unless-stopped
  init: true
  oom_score_adj: ${BRIC_ADMIN_WORKER_OOM_SCORE_ADJ:-650}
  pids_limit: ${BRIC_ADMIN_WORKER_PIDS_LIMIT:-256}
  stop_grace_period: 30s
  logging: *default-logging
  read_only: true
  ulimits:
    core:
      soft: 0
      hard: 0
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: ${BRIC_ADMIN_WORKER_MEM_LIMIT:-640m}
  mem_reservation: ${BRIC_ADMIN_WORKER_MEM_RESERVATION:-384m}
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/admin.env
  environment:
    <<: *release-environment
    NODE_OPTIONS: ${BRIC_ADMIN_WORKER_NODE_OPTIONS:---max-old-space-size=384}
    STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  depends_on:
    storefront-api-blue:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'node -e "const fs=require(''node:fs''); if (!fs.existsSync(''/BRIC_WORKER_HEARTBEAT_V1'')) process.exit(0); const age=Date.now()-Number(fs.readFileSync(''/tmp/bric-admin-worker-heartbeat'',''utf8'').trim()); process.exit(age >= 0 && age <= 45000 ? 0 : 1)"',
      ]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 15s

x-admin-migrations-blue: &admin-migrations-blue
  restart: 'no'
  init: true
  oom_score_adj: ${BRIC_ADMIN_MIGRATIONS_OOM_SCORE_ADJ:-800}
  pids_limit: ${BRIC_ADMIN_MIGRATIONS_PIDS_LIMIT:-128}
  stop_grace_period: 30s
  logging: *default-logging
  read_only: true
  ulimits:
    core:
      soft: 0
      hard: 0
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: ${BRIC_ADMIN_MIGRATIONS_MEM_LIMIT:-768m}
  mem_reservation: ${BRIC_ADMIN_MIGRATIONS_MEM_RESERVATION:-512m}
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/admin.env
  environment:
    <<: *release-environment
    NODE_OPTIONS: ${BRIC_ADMIN_MIGRATIONS_NODE_OPTIONS:---max-old-space-size=512}
    STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
    ADMIN_DB_TASK: ${ADMIN_DB_TASK:-verify}
  depends_on:
    postgres:
      condition: service_healthy

x-storefront-blue: &storefront-blue
  restart: unless-stopped
  init: true
  # The web storefront shares the highest application priority with its API.
  # Native image processing lives outside V8, so retain substantial headroom
  # above the JavaScript heap instead of constraining both to the same ceiling.
  oom_score_adj: ${BRIC_STOREFRONT_WEB_OOM_SCORE_ADJ:--900}
  pids_limit: ${BRIC_STOREFRONT_WEB_PIDS_LIMIT:-256}
  stop_grace_period: 30s
  logging: *default-logging
  # Next's filesystem incremental cache writes generated ISR route artifacts
  # beneath .next/server. Keep this root writable until that cache is moved to
  # an external handler; the other application roots remain read-only.
  read_only: false
  ulimits:
    core:
      soft: 0
      hard: 0
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: ${BRIC_STOREFRONT_WEB_MEM_LIMIT:-3072m}
  mem_reservation: ${BRIC_STOREFRONT_WEB_MEM_RESERVATION:-1536m}
  env_file:
    - ${BRIC_ENV_DIR:-/srv/bric/env}/storefront.env
  environment:
    <<: *release-environment
    NODE_OPTIONS: ${BRIC_STOREFRONT_WEB_NODE_OPTIONS:---max-old-space-size=1024}
    BRIC_NEXT_FETCH_CACHE_MAX_BYTES: ${BRIC_NEXT_FETCH_CACHE_MAX_BYTES:-268435456}
    BRIC_NEXT_FETCH_CACHE_MAX_AGE_SECONDS: ${BRIC_NEXT_FETCH_CACHE_MAX_AGE_SECONDS:-604800}
    BRIC_NEXT_FETCH_CACHE_PRUNE_INTERVAL_SECONDS: ${BRIC_NEXT_FETCH_CACHE_PRUNE_INTERVAL_SECONDS:-900}
    STOREFRONT_API_BASE_URL: http://storefront-api-blue:3001
  depends_on:
    storefront-api-blue:
      condition: service_healthy
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'node -e "fetch(''http://127.0.0.1:3002/api/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
      ]
    interval: 10s
    timeout: 5s
    retries: 12

services:
  postgres:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    restart: unless-stopped
    init: true
    oom_score_adj: ${BRIC_POSTGRES_OOM_SCORE_ADJ:--800}
    pids_limit: ${BRIC_POSTGRES_PIDS_LIMIT:-256}
    stop_grace_period: 60s
    logging: *default-logging
    mem_limit: ${BRIC_POSTGRES_MEM_LIMIT:-2048m}
    mem_reservation: ${BRIC_POSTGRES_MEM_RESERVATION:-1024m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bricadmin}
      POSTGRES_USER: ${POSTGRES_USER:-bricadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bricadmin} -d ${POSTGRES_DB:-bricadmin}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    restart: unless-stopped
    init: true
    oom_score_adj: ${BRIC_REDIS_OOM_SCORE_ADJ:--800}
    pids_limit: ${BRIC_REDIS_PIDS_LIMIT:-128}
    stop_grace_period: 30s
    logging: *default-logging
    mem_limit: ${BRIC_REDIS_MEM_LIMIT:-768m}
    mem_reservation: ${BRIC_REDIS_MEM_RESERVATION:-256m}
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  storefront-api-blue:
    <<: *storefront-api-blue
    image: ${BRIC_IMAGE_STOREFRONT_API_BLUE:-bricadmin-storefront-api-blue}
    volumes:
      - storefront-api-cache-blue:/app/apps/storefront-api/.next/cache
    ports:
      - '127.0.0.1:3101:3001'

  storefront-api-green:
    <<: *storefront-api-blue
    image: ${BRIC_IMAGE_STOREFRONT_API_GREEN:-bricadmin-storefront-api-green}
    volumes:
      - storefront-api-cache-green:/app/apps/storefront-api/.next/cache
    ports:
      - '127.0.0.1:3102:3001'

  storefront-meta-worker:
    <<: *storefront-meta-worker
    image: ${BRIC_IMAGE_STOREFRONT_META_WORKER:-bricadmin-storefront-meta-worker}

  admin-blue:
    <<: *admin-blue
    image: ${BRIC_IMAGE_ADMIN_WEB_BLUE:-bricadmin-admin-blue}
    volumes:
      - admin-cache-blue:/app/apps/admin/.next/cache

  admin-green:
    <<: *admin-blue
    image: ${BRIC_IMAGE_ADMIN_WEB_GREEN:-bricadmin-admin-green}
    volumes:
      - admin-cache-green:/app/apps/admin/.next/cache
    environment:
      <<: *release-environment
      NODE_OPTIONS: ${BRIC_ADMIN_WEB_NODE_OPTIONS:---max-old-space-size=768}
      STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    depends_on:
      storefront-api-green:
        condition: service_healthy

  admin-worker-blue:
    <<: *admin-worker-blue
    image: ${BRIC_IMAGE_ADMIN_WORKER_BLUE:-bricadmin-admin-worker-blue}

  admin-migrations-blue:
    <<: *admin-migrations-blue
    image: ${BRIC_IMAGE_ADMIN_MIGRATIONS_BLUE:-bricadmin-admin-migrations-blue}

  admin-worker-green:
    <<: *admin-worker-blue
    image: ${BRIC_IMAGE_ADMIN_WORKER_GREEN:-bricadmin-admin-worker-green}
    environment:
      <<: *release-environment
      NODE_OPTIONS: ${BRIC_ADMIN_WORKER_NODE_OPTIONS:---max-old-space-size=384}
      STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    depends_on:
      storefront-api-green:
        condition: service_healthy

  admin-migrations-green:
    <<: *admin-migrations-blue
    image: ${BRIC_IMAGE_ADMIN_MIGRATIONS_GREEN:-bricadmin-admin-migrations-green}
    environment:
      <<: *release-environment
      NODE_OPTIONS: ${BRIC_ADMIN_MIGRATIONS_NODE_OPTIONS:---max-old-space-size=512}
      STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
      ADMIN_DB_TASK: ${ADMIN_DB_TASK:-verify}

  storefront-blue:
    <<: *storefront-blue
    image: ${BRIC_IMAGE_STOREFRONT_WEB_BLUE:-bricadmin-storefront-blue}
    volumes:
      - storefront-cache-blue:/app/apps/storefront/.next/cache

  storefront-green:
    <<: *storefront-blue
    image: ${BRIC_IMAGE_STOREFRONT_WEB_GREEN:-bricadmin-storefront-green}
    volumes:
      - storefront-cache-green:/app/apps/storefront/.next/cache
    environment:
      <<: *release-environment
      NODE_OPTIONS: ${BRIC_STOREFRONT_WEB_NODE_OPTIONS:---max-old-space-size=1024}
      BRIC_NEXT_FETCH_CACHE_MAX_BYTES: ${BRIC_NEXT_FETCH_CACHE_MAX_BYTES:-268435456}
      BRIC_NEXT_FETCH_CACHE_MAX_AGE_SECONDS: ${BRIC_NEXT_FETCH_CACHE_MAX_AGE_SECONDS:-604800}
      BRIC_NEXT_FETCH_CACHE_PRUNE_INTERVAL_SECONDS: ${BRIC_NEXT_FETCH_CACHE_PRUNE_INTERVAL_SECONDS:-900}
      STOREFRONT_API_BASE_URL: http://storefront-api-green:3001
    depends_on:
      storefront-api-green:
        condition: service_healthy

  nginx:
    image: nginx:stable-trixie@sha256:09cc2702709e6388d979d8030e3ab4eb1ceb699b2dced26d7543e872a822e823
    restart: unless-stopped
    init: true
    # Keep the small public edge alive long enough to route or report failures.
    oom_score_adj: ${BRIC_NGINX_OOM_SCORE_ADJ:--950}
    pids_limit: ${BRIC_NGINX_PIDS_LIMIT:-128}
    stop_grace_period: 30s
    logging: *default-logging
    mem_limit: ${BRIC_NGINX_MEM_LIMIT:-256m}
    mem_reservation: ${BRIC_NGINX_MEM_RESERVATION:-128m}
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/run:size=8m,mode=0755
    ports:
      - '80:80'
      - '443:443'
    command: ['nginx', '-c', '/etc/nginx-main/nginx.conf', '-g', 'daemon off;']
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${BRIC_CERTBOT_WEBROOT_DIR:-/srv/bric/runtime/certbot-webroot}:/var/www/certbot:ro
      # Keep the mount source stable across immutable release directories. The
      # deploy transaction updates this directory atomically, so routine
      # releases reload Nginx instead of recreating the proxy container.
      - ${BRIC_RUNTIME_DIR:-/srv/bric/runtime}/nginx-main:/etc/nginx-main:ro
      # The renderer atomically replaces default.conf. Mounting the directory
      # keeps that replacement visible inside Nginx; a file bind would retain
      # the old inode and silently defeat a blue/green reload.
      - ${BRIC_RUNTIME_DIR:-/srv/bric/runtime}/nginx:/etc/nginx/conf.d:ro
      - nginx-storefront-image-cache:/var/cache/nginx
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'nginx -t -c /etc/nginx-main/nginx.conf && curl --fail --silent --show-error --resolve "${BRIC_API_DOMAIN:-api.example.com}:443:127.0.0.1" "https://${BRIC_API_DOMAIN:-api.example.com}/api/health" >/dev/null && curl --fail --silent --show-error --resolve "${BRIC_STOREFRONT_DOMAIN:-www.example.com}:443:127.0.0.1" "https://${BRIC_STOREFRONT_DOMAIN:-www.example.com}/api/health" >/dev/null',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  admin-cache-blue:
  admin-cache-green:
  postgres-data:
  redis-data:
  storefront-api-cache-blue:
  storefront-api-cache-green:
  storefront-cache-blue:
  storefront-cache-green:
  nginx-storefront-image-cache:
