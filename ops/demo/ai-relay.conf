worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=60s ipv6=off;
    server {
        listen 8080;
        client_max_body_size 16m;
        location = /health { return 200 'ok'; }
        location ~ ^/v1/(chat/completions|responses)$ {
            limit_except POST { deny all; }
            set $provider_host api.experientiallabs.ai;
            proxy_pass https://$provider_host$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name api.experientiallabs.ai;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_pass_request_headers off;
            proxy_set_header Host api.experientiallabs.ai;
            proxy_set_header Content-Type application/json;
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
        location / { return 404; }
    }
}
