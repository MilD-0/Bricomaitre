worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_x_real_ip $visitor {
        "" $remote_addr;
        default $http_x_real_ip;
    }
    map $http_x_forwarded_proto $forwarded_scheme {
        "" $scheme;
        default $http_x_forwarded_proto;
    }
    map $server_port $upstream {
        3400 admin:3000;
        3401 storefront-api:3001;
        3402 storefront:3002;
        3808 mock-services:8080;
        3900 object-storage:9000;
        3901 object-storage:9001;
    }
    # Shared global limits still work when a client changes its claimed IP.
    limit_req_zone $server_name zone=global:1m rate=100r/s;
    limit_req_zone $visitor zone=visitor:4m rate=20r/s;
    limit_req_zone $visitor zone=expensive:4m rate=20r/m;
    limit_req_zone $server_name zone=expensive_global:1m rate=60r/m;
    limit_conn_zone $visitor zone=connections:4m;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 50m;
    client_body_timeout 20s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $visitor;
    proxy_set_header X-Forwarded-For $visitor;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header Connection "";
    server {
        listen 8080;
        location = /health { return 200 "ok\n"; }
    }
    server {
        listen 3400;
        listen 3401;
        listen 3402;
        server_name demo-apps;
        limit_conn connections 24;
        location ~ ^/api/.*(uploads/|import|export|/labels?$) {
            limit_req zone=expensive burst=5 nodelay;
            limit_req zone=expensive_global burst=10 nodelay;
            proxy_pass http://$upstream;
        }
        location / {
            limit_req zone=visitor burst=120 nodelay;
            limit_req zone=global burst=200 nodelay;
            proxy_pass http://$upstream;
        }
    }
    server {
        listen 3900;
        listen 3901;
        listen 3808;
        server_name demo-dependencies;
        limit_conn connections 32;
        limit_req zone=global burst=200 nodelay;
        location / { proxy_pass http://$upstream; }
    }
}
