user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Retained legacy tracking routes carry bearer credentials in the path.
  # Keep the routes compatible while ensuring credentials never reach logs.
  map $uri $bric_log_uri {
    ~^(/(?:storefront|api)/orders/track)/[^/]+$ $1/[redacted];
    default $uri;
  }

  # Deliberately omit query strings and referrers: both can carry order-access
  # tokens or customer-entered search data.
  log_format main '$request_id $remote_addr - $remote_user [$time_local] "$request_method $bric_log_uri $server_protocol" '
                  '$status $body_bytes_sent '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  # Shield the Next.js process from repeated WebP transformations and cache
  # reads during paid-traffic and crawler bursts. The cache key retains the
  # complete optimizer query string (source URL, width, and quality), while
  # max_size and inactive enforce bounded on-disk retention.
  proxy_cache_path /var/cache/nginx/storefront-images
                   levels=1:2
                   keys_zone=storefront_images:16m
                   max_size=384m
                   inactive=7d
                   use_temp_path=off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/x-component
    application/json
    application/javascript
    application/xml+rss
    application/xml
    image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
