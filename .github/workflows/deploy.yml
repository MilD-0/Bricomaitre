name: Release production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  release-context:
    name: Select verified commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      created: ${{ steps.release.outputs.created }}
      current: ${{ steps.release.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - name: Record immutable release identity
        id: release
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          current_main="$(bash ops/scripts/current-main-sha.sh)"
          if [[ "$current_main" == "$VERIFIED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Verified commit ${VERIFIED_SHA} was superseded by ${current_main}; image builds were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate release configuration before image builds
        if: steps.release.outputs.current == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_ADMIN_MODEL: ${{ vars.AI_ADMIN_MODEL || 'openai/gpt-5.6-luna' }}
          AI_CONTENT_MODEL: ${{ vars.AI_CONTENT_MODEL || 'openai/gpt-5.6-luna' }}
          AI_STOREFRONT_MODEL: ${{ vars.AI_STOREFRONT_MODEL || 'openai/gpt-5.6-luna' }}
          AI_STOREFRONT_FALLBACK_MODEL: ${{ vars.AI_STOREFRONT_FALLBACK_MODEL || 'deepseek/deepseek-v4-flash' }}
          AI_STOREFRONT_MODEL_OPTIONS: ${{ vars.AI_STOREFRONT_MODEL_OPTIONS || 'openai/gpt-5.6-luna,deepseek/deepseek-v4-flash' }}
          ADMIN_META_ADS_SYNC_ENABLED: ${{ vars.ADMIN_META_ADS_SYNC_ENABLED || 'false' }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ADS_ACCESS_TOKEN: ${{ secrets.META_ADS_ACCESS_TOKEN }}
          ADMIN_SEARCH_CONSOLE_SYNC_ENABLED: ${{ vars.ADMIN_SEARCH_CONSOLE_SYNC_ENABLED || 'false' }}
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_BASE64 }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN_ADMIN: ${{ secrets.SENTRY_DSN_ADMIN }}
          NEXT_PUBLIC_SENTRY_DSN_ADMIN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
          SENTRY_DSN_WORKER: ${{ secrets.SENTRY_DSN_WORKER }}
          SENTRY_DSN_STOREFRONT_API: ${{ secrets.SENTRY_DSN_STOREFRONT_API }}
          SENTRY_DSN_STOREFRONT: ${{ secrets.SENTRY_DSN_STOREFRONT }}
          NEXT_PUBLIC_SENTRY_DSN_STOREFRONT: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_STOREFRONT }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          test -n "$AI_ADMIN_MODEL"
          test -n "$AI_CONTENT_MODEL"
          test -n "$AI_STOREFRONT_MODEL"
          test -n "$AI_STOREFRONT_FALLBACK_MODEL"
          test -n "$AI_STOREFRONT_MODEL_OPTIONS"
          test -n "$SENTRY_AUTH_TOKEN"
          test -n "$SENTRY_DSN_ADMIN"
          test -n "$NEXT_PUBLIC_SENTRY_DSN_ADMIN"
          test -n "$SENTRY_DSN_WORKER"
          test -n "$SENTRY_DSN_STOREFRONT_API"
          test -n "$SENTRY_DSN_STOREFRONT"
          test -n "$NEXT_PUBLIC_SENTRY_DSN_STOREFRONT"
          case "$ADMIN_META_ADS_SYNC_ENABLED" in
            true)
              test -n "$META_AD_ACCOUNT_ID"
              test -n "$META_ADS_ACCESS_TOKEN"
              ;;
            false) ;;
            *) echo "ADMIN_META_ADS_SYNC_ENABLED must be true or false" >&2; exit 64 ;;
          esac
          case "$ADMIN_SEARCH_CONSOLE_SYNC_ENABLED" in
            true) test -n "$GOOGLE_SEARCH_CONSOLE_CREDENTIALS_BASE64" ;;
            false) ;;
            *) echo "ADMIN_SEARCH_CONSOLE_SYNC_ENABLED must be true or false" >&2; exit 64 ;;
          esac

  build-api-images:
    name: Build images / storefront API
    needs: release-context
    if: needs.release-context.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAMESPACE: ghcr.io/mild-0/bricomaitre
      SHA_TAG: sha-${{ needs.release-context.outputs.sha }}
      RELEASE_CHANNEL: main
      IMAGE_REVISION: ${{ needs.release-context.outputs.sha }}
      IMAGE_CREATED: ${{ needs.release-context.outputs.created }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || 'bricomaitre' }}
      SENTRY_PROJECT_STOREFRONT_API: ${{ vars.SENTRY_PROJECT_STOREFRONT_API || 'brico-api' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.sha }}
          persist-credentials: false
      - name: Isolate Docker registry credentials
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config"
          {
            echo "DOCKER_CONFIG=$docker_config"
            echo "BUILDX_CONFIG=$HOME/.docker/buildx"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          name: bricomaitre-ci
          driver-opts: network=host
          keep-state: true
          cache-binary: false
          cleanup: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Configure cached Cosign
        run: bash ops/scripts/install-cosign.sh
      - name: Build, push, and sign storefront API images
        run: |
          set -euo pipefail
          mkdir -p build-metadata release-parts
          bash ops/scripts/build-release-images.sh \
            api build-metadata/api.json build-metadata/api.log
          echo "## Storefront API images" >> "$GITHUB_STEP_SUMMARY"
          bash ops/scripts/sign-bake-images.sh \
            build-metadata/api.json \
            release-parts/.bric-images-api.env \
            BRIC_IMAGE_STOREFRONT_API:storefront-api-web:storefront-api-web \
            BRIC_IMAGE_STOREFRONT_META_WORKER:storefront-api-meta-worker:storefront-api-meta-worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bric-images-api
          path: release-parts/.bric-images-api.env
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  build-admin-images:
    name: Build images / admin
    needs: release-context
    if: needs.release-context.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAMESPACE: ghcr.io/mild-0/bricomaitre
      SHA_TAG: sha-${{ needs.release-context.outputs.sha }}
      RELEASE_CHANNEL: main
      IMAGE_REVISION: ${{ needs.release-context.outputs.sha }}
      IMAGE_CREATED: ${{ needs.release-context.outputs.created }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      STOREFRONT_BUILD_API_BASE_URL: ${{ vars.STOREFRONT_BUILD_API_BASE_URL || 'https://api.bricomaitre.com' }}
      NEXT_PUBLIC_SENTRY_DSN_ADMIN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || 'bricomaitre' }}
      SENTRY_PROJECT_ADMIN: ${{ vars.SENTRY_PROJECT_ADMIN || 'bricadmin' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.sha }}
          persist-credentials: false
      - name: Isolate Docker registry credentials
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config"
          {
            echo "DOCKER_CONFIG=$docker_config"
            echo "BUILDX_CONFIG=$HOME/.docker/buildx"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          name: bricomaitre-ci
          driver-opts: network=host
          keep-state: true
          cache-binary: false
          cleanup: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Configure cached Cosign
        run: bash ops/scripts/install-cosign.sh
      - name: Build, push, and sign admin images
        run: |
          set -euo pipefail
          mkdir -p build-metadata release-parts
          bash ops/scripts/build-release-images.sh \
            admin build-metadata/admin.json build-metadata/admin.log
          echo "## Admin images" >> "$GITHUB_STEP_SUMMARY"
          bash ops/scripts/sign-bake-images.sh \
            build-metadata/admin.json \
            release-parts/.bric-images-admin.env \
            BRIC_IMAGE_ADMIN_WEB:admin-web:admin-web \
            BRIC_IMAGE_ADMIN_WORKER:admin-worker:admin-worker \
            BRIC_IMAGE_ADMIN_MIGRATIONS:admin-migrations:admin-migrations
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bric-images-admin
          path: release-parts/.bric-images-admin.env
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  build-storefront-image:
    name: Build images / storefront
    needs: release-context
    if: needs.release-context.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAMESPACE: ghcr.io/mild-0/bricomaitre
      SHA_TAG: sha-${{ needs.release-context.outputs.sha }}
      RELEASE_CHANNEL: main
      IMAGE_REVISION: ${{ needs.release-context.outputs.sha }}
      IMAGE_CREATED: ${{ needs.release-context.outputs.created }}
      NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_TIKTOK_PIXEL_ID }}
      NEXT_PUBLIC_SENTRY_DSN_STOREFRONT: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_STOREFRONT }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://bricomaitre.com' }}
      NEXT_PUBLIC_CLOUDFRONT_URL: ${{ vars.NEXT_PUBLIC_CLOUDFRONT_URL }}
      NEXT_PUBLIC_STOREFRONT_IMAGE_ORIGINS: ${{ vars.NEXT_PUBLIC_STOREFRONT_IMAGE_ORIGINS }}
      STOREFRONT_BUILD_API_BASE_URL: ${{ vars.STOREFRONT_BUILD_API_BASE_URL || 'https://api.bricomaitre.com' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || 'bricomaitre' }}
      SENTRY_PROJECT_STOREFRONT: ${{ vars.SENTRY_PROJECT_STOREFRONT || 'bricomaitre' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.sha }}
          persist-credentials: false
      - name: Isolate Docker registry credentials
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config"
          {
            echo "DOCKER_CONFIG=$docker_config"
            echo "BUILDX_CONFIG=$HOME/.docker/buildx"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          name: bricomaitre-ci
          driver-opts: network=host
          keep-state: true
          cache-binary: false
          cleanup: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Configure cached Cosign
        run: bash ops/scripts/install-cosign.sh
      - name: Build, push, and sign storefront image
        run: |
          set -euo pipefail
          mkdir -p build-metadata release-parts
          bash ops/scripts/build-release-images.sh \
            storefront build-metadata/storefront.json build-metadata/storefront-web.log
          echo "## Storefront image" >> "$GITHUB_STEP_SUMMARY"
          bash ops/scripts/sign-bake-images.sh \
            build-metadata/storefront.json \
            release-parts/.bric-images-storefront.env \
            BRIC_IMAGE_STOREFRONT_WEB:storefront-web:storefront-web
          printf 'BRIC_STOREFRONT_APP=storefront\n' >> release-parts/.bric-images-storefront.env
          echo "- Release surface: storefront" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bric-images-storefront
          path: release-parts/.bric-images-storefront.env
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  assemble-release-manifest:
    name: Assemble release manifest
    needs:
      - release-context
      - build-api-images
      - build-admin-images
      - build-storefront-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bric-images-*
          path: release-parts
          merge-multiple: true
      - name: Assemble and validate release manifest
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.sha }}
          VERIFICATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p release-manifest
          node ops/scripts/assemble-release-image-manifest.mjs \
            release-manifest/.bric-images.env \
            release-parts/.bric-images-api.env \
            release-parts/.bric-images-admin.env \
            release-parts/.bric-images-storefront.env
          {
            echo "BRIC_RELEASE_ID=${RELEASE_SHA::12}-${GITHUB_RUN_ID}"
            echo "BRIC_RELEASE_COMMIT=${RELEASE_SHA}"
            echo "BRIC_RELEASE_CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BRIC_WORKFLOW_RUN_ID=${GITHUB_RUN_ID}"
            echo "BRIC_VERIFICATION_RUN_ID=${VERIFICATION_RUN_ID}"
            echo "BRIC_REGISTRY=ghcr.io"
          } > release-manifest/.bric-release.env
          echo "## Release manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Six signed image digests and storefront build evidence validated" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bric-release-manifest
          path: |
            release-manifest/.bric-release.env
            release-manifest/.bric-images.env
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Deploy verified release
    needs:
      - release-context
      - assemble-release-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: bricomaitre-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://bricomaitre.com
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_SHA: ${{ needs.release-context.outputs.sha }}
      DEPLOY_HOST: ${{ secrets.BRIC_DEPLOY_SSH_HOST }}
      DEPLOY_PORT: ${{ secrets.BRIC_DEPLOY_SSH_PORT || '2345' }}
      DEPLOY_USER: ${{ secrets.BRIC_DEPLOY_SSH_USER || 'codex' }}
      DEPLOY_KEY: ${{ secrets.BRIC_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.BRIC_DEPLOY_KNOWN_HOSTS }}
      ECOTRACK_EMIR_BASE_URL: ${{ secrets.ECOTRACK_EMIR_BASE_URL }}
      ECOTRACK_EMIR_TOKEN: ${{ secrets.ECOTRACK_EMIR_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_ADMIN_MODEL: ${{ vars.AI_ADMIN_MODEL || 'openai/gpt-5.6-luna' }}
      AI_CONTENT_MODEL: ${{ vars.AI_CONTENT_MODEL || 'openai/gpt-5.6-luna' }}
      AI_STOREFRONT_MODEL: ${{ vars.AI_STOREFRONT_MODEL || 'openai/gpt-5.6-luna' }}
      AI_STOREFRONT_FALLBACK_MODEL: ${{ vars.AI_STOREFRONT_FALLBACK_MODEL || 'deepseek/deepseek-v4-flash' }}
      AI_STOREFRONT_MODEL_OPTIONS: ${{ vars.AI_STOREFRONT_MODEL_OPTIONS || 'openai/gpt-5.6-luna,deepseek/deepseek-v4-flash' }}
      ADMIN_META_ADS_SYNC_ENABLED: ${{ vars.ADMIN_META_ADS_SYNC_ENABLED || 'false' }}
      META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      META_ADS_ACCESS_TOKEN: ${{ secrets.META_ADS_ACCESS_TOKEN }}
      META_ADS_GRAPH_API_VERSION: ${{ vars.META_ADS_GRAPH_API_VERSION || 'v25.0' }}
      ADMIN_SEARCH_CONSOLE_SYNC_ENABLED: ${{ vars.ADMIN_SEARCH_CONSOLE_SYNC_ENABLED || 'false' }}
      GOOGLE_SEARCH_CONSOLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_BASE64 }}
      SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL || 'sc-domain:bricomaitre.com' }}
      SEARCH_CONSOLE_SITE_ORIGIN: ${{ vars.SEARCH_CONSOLE_SITE_ORIGIN || 'https://bricomaitre.com' }}
      GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      GOOGLE_ANALYTICS_API_SECRET: ${{ secrets.GOOGLE_ANALYTICS_API_SECRET }}
      TIKTOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_TIKTOK_PIXEL_ID }}
      TIKTOK_EVENTS_API_ACCESS_TOKEN: ${{ secrets.TIKTOK_EVENTS_API_ACCESS_TOKEN }}
      SENTRY_DSN_ADMIN: ${{ secrets.SENTRY_DSN_ADMIN }}
      NEXT_PUBLIC_SENTRY_DSN_ADMIN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
      SENTRY_DSN_WORKER: ${{ secrets.SENTRY_DSN_WORKER }}
      SENTRY_DSN_STOREFRONT_API: ${{ secrets.SENTRY_DSN_STOREFRONT_API }}
      SENTRY_DSN_STOREFRONT: ${{ secrets.SENTRY_DSN_STOREFRONT }}
      NEXT_PUBLIC_SENTRY_DSN_STOREFRONT: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_STOREFRONT }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.sha }}
          persist-credentials: true
      - name: Reject a superseded release
        id: freshness
        run: |
          set -euo pipefail
          current_main="$(bash ops/scripts/current-main-sha.sh)"
          if [[ "$current_main" == "$RELEASE_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Release ${RELEASE_SHA} was superseded by ${current_main}; production was not changed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bric-release-manifest
          path: release-manifest
      - name: Prepare SSH
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_READ_TOKEN"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]

          ssh_dir="$RUNNER_TEMP/bric-deploy-ssh"
          ssh_key="$ssh_dir/deploy-key"
          known_hosts="$ssh_dir/known-hosts"
          ssh_config="$ssh_dir/config"
          install -m 700 -d "$ssh_dir"
          install -m 600 /dev/null "$ssh_key"
          install -m 600 /dev/null "$known_hosts"
          install -m 600 /dev/null "$ssh_config"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          {
            printf 'Host bric-production\n'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  Port %s\n' "$DEPLOY_PORT"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  IdentityFile %s\n' "$ssh_key"
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
            printf '  StrictHostKeyChecking yes\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  ServerAliveInterval 15\n'
            printf '  ServerAliveCountMax 4\n'
            printf '  TCPKeepAlive yes\n'
          } > "$ssh_config"
          echo "BRIC_DEPLOY_SSH_CONFIG=$ssh_config" >> "$GITHUB_ENV"
      - name: Stage release, cut over, and run production smoke checks
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source release-manifest/.bric-release.env
          set +a
          test "$BRIC_RELEASE_COMMIT" = "$RELEASE_SHA"

          release_path="/srv/bric/releases/${BRIC_RELEASE_ID}"
          bundle_dir="$(mktemp -d)"
          env_transaction_started=false
          cleanup_deploy_step() {
            status=$?
            trap - EXIT
            rm -rf "$bundle_dir"
            if [[ "$env_transaction_started" == true ]]; then
              ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production \
                "source '$release_path/ops/scripts/blue-green.sh'; rollback_runtime_env_transaction" || true
            fi
            exit "$status"
          }
          trap cleanup_deploy_step EXIT

          mkdir -p \
            "$bundle_dir/ops/scripts" \
            "$bundle_dir/ops/docker" \
            "$bundle_dir/ops/host" \
            "$bundle_dir/ops/nginx" \
            "$bundle_dir/ops/env" \
            "$bundle_dir/third_party/licenses"
          cp release-manifest/.bric-release.env "$bundle_dir/.bric-release.env"
          cp release-manifest/.bric-images.env "$bundle_dir/.bric-images.env"
          python3 ops/scripts/verify-migration-rollback-safety.py \
            --build-state "$PWD" "$RELEASE_SHA" "$bundle_dir/.bric-migrations.json"
          rsync -a ops/scripts/ "$bundle_dir/ops/scripts/"
          cp ops/docker/compose.prod.yml "$bundle_dir/ops/docker/compose.prod.yml"
          rsync -a ops/host/ "$bundle_dir/ops/host/"
          rsync -a ops/nginx/ "$bundle_dir/ops/nginx/"
          rsync -a ops/env/ "$bundle_dir/ops/env/"
          rsync -a third_party/licenses/ "$bundle_dir/third_party/licenses/"
          cp LICENSE NOTICE SECURITY.md "$bundle_dir/"

          ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production \
            "mkdir -p '$release_path'"
          rsync -az --delete \
            -e "ssh -F $BRIC_DEPLOY_SSH_CONFIG" \
            "$bundle_dir/" "bric-production:$release_path/"
          printf '%s\n' "$GHCR_READ_TOKEN" | ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin >/dev/null"

          ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production \
            "source '$release_path/ops/scripts/blue-green.sh'; begin_runtime_env_transaction"
          env_transaction_started=true

          printf '%s\n%s\n' "$ECOTRACK_EMIR_BASE_URL" "$ECOTRACK_EMIR_TOKEN" | \
            ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production '
              set -euo pipefail
              IFS= read -r emir_base_url
              IFS= read -r emir_token
              test -n "$emir_base_url"
              test -n "$emir_token"
              env_file="/srv/bric/env/admin.env"
              umask 077
              tmp_file="${env_file}.tmp.$$"
              grep -v -E "^ECOTRACK_EMIR_(BASE_URL|TOKEN)=" "$env_file" > "$tmp_file" || true
              printf "ECOTRACK_EMIR_BASE_URL=%s\nECOTRACK_EMIR_TOKEN=%s\n" "$emir_base_url" "$emir_token" >> "$tmp_file"
              mv "$tmp_file" "$env_file"
            '
          printf '%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$OPENROUTER_API_KEY" \
            "$AI_ADMIN_MODEL" \
            "$AI_CONTENT_MODEL" \
            "$AI_STOREFRONT_MODEL" \
            "$AI_STOREFRONT_FALLBACK_MODEL" \
            "$AI_STOREFRONT_MODEL_OPTIONS" | \
            ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production '
              set -euo pipefail
              IFS= read -r openrouter_api_key
              IFS= read -r admin_model
              IFS= read -r content_model
              IFS= read -r storefront_model
              IFS= read -r storefront_fallback_model
              IFS= read -r storefront_model_options
              test -n "$openrouter_api_key"
              test -n "$admin_model"
              test -n "$content_model"
              test -n "$storefront_model"
              test -n "$storefront_fallback_model"
              test -n "$storefront_model_options"
              umask 077
              admin_env_file="/srv/bric/env/admin.env"
              admin_tmp_file="${admin_env_file}.tmp.$$"
              grep -v -E "^(OPENROUTER_API_KEY|AI_ADMIN_MODEL|AI_CONTENT_MODEL|AI_STOREFRONT_MODEL|AI_STOREFRONT_FALLBACK_MODEL|AI_STOREFRONT_MODEL_OPTIONS)=" "$admin_env_file" > "$admin_tmp_file" || true
              printf "OPENROUTER_API_KEY=%s\nAI_ADMIN_MODEL=%s\nAI_CONTENT_MODEL=%s\nAI_STOREFRONT_MODEL=%s\nAI_STOREFRONT_FALLBACK_MODEL=%s\nAI_STOREFRONT_MODEL_OPTIONS=%s\n" \
                "$openrouter_api_key" "$admin_model" "$content_model" "$storefront_model" "$storefront_fallback_model" "$storefront_model_options" >> "$admin_tmp_file"
              mv "$admin_tmp_file" "$admin_env_file"
              storefront_env_file="/srv/bric/env/storefront.env"
              storefront_tmp_file="${storefront_env_file}.tmp.$$"
              grep -v -E "^(OPENROUTER_API_KEY|AI_STOREFRONT_MODEL|AI_STOREFRONT_FALLBACK_MODEL)=" "$storefront_env_file" > "$storefront_tmp_file" || true
              printf "OPENROUTER_API_KEY=%s\nAI_STOREFRONT_MODEL=%s\nAI_STOREFRONT_FALLBACK_MODEL=%s\n" \
                "$openrouter_api_key" "$storefront_model" "$storefront_fallback_model" >> "$storefront_tmp_file"
              mv "$storefront_tmp_file" "$storefront_env_file"
            '
          printf '%s\n%s\n%s\n%s\n' \
            "$ADMIN_META_ADS_SYNC_ENABLED" \
            "$META_AD_ACCOUNT_ID" \
            "$META_ADS_ACCESS_TOKEN" \
            "$META_ADS_GRAPH_API_VERSION" | \
            ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production '
              set -euo pipefail
              IFS= read -r sync_enabled
              IFS= read -r account_id
              IFS= read -r access_token
              IFS= read -r graph_version
              case "$sync_enabled" in
                true)
                  test -n "$account_id"
                  test -n "$access_token"
                  ;;
                false) ;;
                *) echo "ADMIN_META_ADS_SYNC_ENABLED must be true or false" >&2; exit 64 ;;
              esac
              env_file="/srv/bric/env/admin.env"
              umask 077
              tmp_file="${env_file}.tmp.$$"
              grep -v -E "^(ADMIN_META_ADS_SYNC_ENABLED|META_AD_ACCOUNT_ID|META_ADS_ACCESS_TOKEN|META_ADS_GRAPH_API_VERSION)=" "$env_file" > "$tmp_file" || true
              printf "ADMIN_META_ADS_SYNC_ENABLED=%s\nMETA_AD_ACCOUNT_ID=%s\nMETA_ADS_ACCESS_TOKEN=%s\nMETA_ADS_GRAPH_API_VERSION=%s\n" \
                "$sync_enabled" "$account_id" "$access_token" "$graph_version" >> "$tmp_file"
              mv "$tmp_file" "$env_file"
            '
          printf '%s\n%s\n%s\n%s\n' \
            "$ADMIN_SEARCH_CONSOLE_SYNC_ENABLED" \
            "$GOOGLE_SEARCH_CONSOLE_CREDENTIALS_BASE64" \
            "$SEARCH_CONSOLE_SITE_URL" \
            "$SEARCH_CONSOLE_SITE_ORIGIN" | \
            ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production '
              set -euo pipefail
              IFS= read -r sync_enabled
              IFS= read -r credentials_base64
              IFS= read -r site_url
              IFS= read -r site_origin
              case "$sync_enabled" in
                true) test -n "$credentials_base64" ;;
                false) ;;
                *) echo "ADMIN_SEARCH_CONSOLE_SYNC_ENABLED must be true or false" >&2; exit 64 ;;
              esac
              env_file="/srv/bric/env/admin.env"
              umask 077
              tmp_file="${env_file}.tmp.$$"
              grep -v -E "^(ADMIN_SEARCH_CONSOLE_SYNC_ENABLED|GOOGLE_SEARCH_CONSOLE_CREDENTIALS_BASE64|SEARCH_CONSOLE_SITE_URL|SEARCH_CONSOLE_SITE_ORIGIN)=" "$env_file" > "$tmp_file" || true
              printf "ADMIN_SEARCH_CONSOLE_SYNC_ENABLED=%s\nGOOGLE_SEARCH_CONSOLE_CREDENTIALS_BASE64=%s\nSEARCH_CONSOLE_SITE_URL=%s\nSEARCH_CONSOLE_SITE_ORIGIN=%s\n" \
                "$sync_enabled" "$credentials_base64" "$site_url" "$site_origin" >> "$tmp_file"
              mv "$tmp_file" "$env_file"
            '
          printf '%s\n%s\n%s\n%s\n' \
            "$GOOGLE_ANALYTICS_MEASUREMENT_ID" \
            "$GOOGLE_ANALYTICS_API_SECRET" \
            "$TIKTOK_PIXEL_ID" \
            "$TIKTOK_EVENTS_API_ACCESS_TOKEN" | \
            ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production '
              set -euo pipefail
              IFS= read -r measurement_id
              IFS= read -r api_secret
              IFS= read -r tiktok_pixel_id
              IFS= read -r tiktok_access_token
              test -n "$measurement_id"
              test -n "$api_secret"
              if [[ -n "$tiktok_pixel_id" && -n "$tiktok_access_token" ]]; then
                tiktok_enabled=true
              elif [[ -z "$tiktok_pixel_id" && -z "$tiktok_access_token" ]]; then
                tiktok_enabled=false
              else
                echo "TikTok destination requires both pixel ID and Events API access token" >&2
                exit 64
              fi
              api_env_file="/srv/bric/env/storefront-api.env"
              umask 077
              api_tmp_file="${api_env_file}.tmp.$$"
              grep -v -E "^(GOOGLE_ANALYTICS_(MEASUREMENT_ID|API_SECRET)|TIKTOK_(PIXEL_ID|EVENTS_API_ACCESS_TOKEN)|MARKETING_(GOOGLE|TIKTOK)_DESTINATION_ENABLED)=" "$api_env_file" > "$api_tmp_file" || true
              printf "GOOGLE_ANALYTICS_MEASUREMENT_ID=%s\nGOOGLE_ANALYTICS_API_SECRET=%s\nTIKTOK_PIXEL_ID=%s\nTIKTOK_EVENTS_API_ACCESS_TOKEN=%s\nMARKETING_GOOGLE_DESTINATION_ENABLED=true\nMARKETING_TIKTOK_DESTINATION_ENABLED=%s\n" \
                "$measurement_id" "$api_secret" "$tiktok_pixel_id" "$tiktok_access_token" "$tiktok_enabled" >> "$api_tmp_file"
              mv "$api_tmp_file" "$api_env_file"
              admin_env_file="/srv/bric/env/admin.env"
              admin_tmp_file="${admin_env_file}.tmp.$$"
              grep -v -E "^MARKETING_(GOOGLE|TIKTOK)_DESTINATION_ENABLED=" "$admin_env_file" > "$admin_tmp_file" || true
              printf "MARKETING_GOOGLE_DESTINATION_ENABLED=true\nMARKETING_TIKTOK_DESTINATION_ENABLED=%s\n" \
                "$tiktok_enabled" >> "$admin_tmp_file"
              mv "$admin_tmp_file" "$admin_env_file"
            '
          printf '%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$SENTRY_DSN_ADMIN" \
            "$NEXT_PUBLIC_SENTRY_DSN_ADMIN" \
            "$SENTRY_DSN_WORKER" \
            "$SENTRY_DSN_STOREFRONT_API" \
            "$SENTRY_DSN_STOREFRONT" \
            "$NEXT_PUBLIC_SENTRY_DSN_STOREFRONT" | \
            ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production '
              set -euo pipefail
              IFS= read -r admin_dsn
              IFS= read -r admin_browser_dsn
              IFS= read -r worker_dsn
              IFS= read -r api_dsn
              IFS= read -r storefront_dsn
              IFS= read -r storefront_browser_dsn
              test -n "$admin_dsn"
              test -n "$admin_browser_dsn"
              test -n "$worker_dsn"
              test -n "$api_dsn"
              test -n "$storefront_dsn"
              test -n "$storefront_browser_dsn"
              umask 077
              admin_env_file="/srv/bric/env/admin.env"
              admin_tmp_file="${admin_env_file}.tmp.$$"
              grep -v -E "^(SENTRY_DSN_ADMIN|NEXT_PUBLIC_SENTRY_DSN_ADMIN|SENTRY_DSN_WORKER)=" "$admin_env_file" > "$admin_tmp_file" || true
              printf "SENTRY_DSN_ADMIN=%s\nNEXT_PUBLIC_SENTRY_DSN_ADMIN=%s\nSENTRY_DSN_WORKER=%s\n" \
                "$admin_dsn" "$admin_browser_dsn" "$worker_dsn" >> "$admin_tmp_file"
              mv "$admin_tmp_file" "$admin_env_file"
              api_env_file="/srv/bric/env/storefront-api.env"
              api_tmp_file="${api_env_file}.tmp.$$"
              grep -v -E "^SENTRY_DSN_STOREFRONT_API=" "$api_env_file" > "$api_tmp_file" || true
              printf "SENTRY_DSN_STOREFRONT_API=%s\n" "$api_dsn" >> "$api_tmp_file"
              mv "$api_tmp_file" "$api_env_file"
              storefront_env_file="/srv/bric/env/storefront.env"
              storefront_tmp_file="${storefront_env_file}.tmp.$$"
              grep -v -E "^(SENTRY_DSN_STOREFRONT|NEXT_PUBLIC_SENTRY_DSN_STOREFRONT|(SENTRY|NEXT_PUBLIC_SENTRY)_[A-Z0-9_]+_STOREFRONT_NEW)=" "$storefront_env_file" > "$storefront_tmp_file" || true
              printf "SENTRY_DSN_STOREFRONT=%s\nNEXT_PUBLIC_SENTRY_DSN_STOREFRONT=%s\n" \
                "$storefront_dsn" "$storefront_browser_dsn" >> "$storefront_tmp_file"
              mv "$storefront_tmp_file" "$storefront_env_file"
            '

          ssh -F "$BRIC_DEPLOY_SSH_CONFIG" bric-production \
            "bash '$release_path/ops/scripts/deploy.sh' '$release_path' '$RELEASE_SHA'"
          env_transaction_started=false
          echo "## Deploy phase" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Deployed verified release ${BRIC_RELEASE_ID}" >> "$GITHUB_STEP_SUMMARY"
