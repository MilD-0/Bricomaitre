name: Demo release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable demo version, for example 2026.09.05
        required: true
        type: string
      publish:
        description: Publish tested images and create a draft GitHub release
        default: false
        type: boolean
      architecture:
        description: Native installation targets; publication requires all
        default: all
        type: choice
        options:
          - all
          - amd64
          - arm64

permissions:
  contents: read

concurrency:
  group: demo-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-media:
    name: Prepare shared catalog media
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Prepare one media set for every architecture
        run: |
          pnpm demo:data:verify
          pnpm demo:images
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-catalog-media
          path: ops/demo/.cache/images/catalog/
          compression-level: 0
          retention-days: 1

  native-install:
    name: Build and install / ${{ matrix.arch }}
    needs: prepare-media
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'all' && '["amd64","arm64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      DEMO_VERSION: ${{ inputs.version }}
      DEMO_PLATFORMS: linux/${{ matrix.arch }}
      DEMO_TAG_SUFFIX: -${{ matrix.arch }}
      DEMO_IMAGE_NAMESPACE: ghcr.io/mild-0/bricomaitre-demo
    steps:
      - name: Require both architectures for publication
        if: inputs.publish && inputs.architecture != 'all'
        run: |
          echo 'Publication requires architecture=all.' >&2
          exit 1
      - name: Reclaim unused hosted-runner SDK space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          # This Docker/Node job does not use Android, .NET, or CodeQL.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: default-load=true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-catalog-media
          path: ops/demo/.cache/images/catalog
      - name: Verify packaging tools and assemble bundle
        run: |
          pnpm test:ops
          pnpm demo:data:verify
          node ops/demo/release/assemble.mjs "$DEMO_VERSION" "$RUNNER_TEMP/demo-release"
      - name: Build release images
        run: docker compose -f "$RUNNER_TEMP/demo-release/compose.build.json" build
      - name: Release build cache before database installation
        run: |
          docker buildx prune --all --force
          df -h /
      - name: Test installation from the extracted bundle
        run: node ops/demo/release/verify.mjs "$RUNNER_TEMP/demo-release/bricomaitre-demo"
      - name: Upload tested bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-bundle-${{ matrix.arch }}
          path: ${{ runner.temp }}/demo-release/bricomaitre-demo/
          retention-days: 14
      - name: Authenticate image publication
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture images
        if: inputs.publish
        run: docker compose -f "$RUNNER_TEMP/demo-release/compose.build.json" push
      - name: Report installation state
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/demo-release/bricomaitre-demo/compose.yaml" ]; then
            docker compose -p bricomaitre-demo-release-test -f "$RUNNER_TEMP/demo-release/bricomaitre-demo/compose.yaml" ps -a
          fi

  release:
    needs: native-install
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      DEMO_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: demo-bundle-*
          path: ${{ runner.temp }}/bundles
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine architectures into a private draft
        env:
          DEMO_PRIVATE_DRAFT: '1'
        run: |
          node ops/demo/release/publish.mjs \
            "$RUNNER_TEMP/bundles/demo-bundle-amd64" \
            "$RUNNER_TEMP/bundles/demo-bundle-arm64" \
            "$RUNNER_TEMP/release/bricomaitre-demo"
          node ops/demo/release/archive.mjs "$RUNNER_TEMP/release/bricomaitre-demo"
      - name: Create the reviewable release
        run: |
          gh release create "demo-$DEMO_VERSION" \
            "$RUNNER_TEMP/release/bricomaitre-demo-$DEMO_VERSION.tar.gz" \
            "$RUNNER_TEMP/release/bricomaitre-demo-$DEMO_VERSION.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Bricomaitre demo $DEMO_VERSION" \
            --notes-file docs/demo.md
